<!doctype html><html lang="de"><head><meta charset="utf-8">
<meta name="robots" content="noindex, nofollow, noarchive">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Posaunenchor Striesen Blasewitz</title>
<meta name="theme-color" content="#0f1f3d"><meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="Posaunenchor">
<link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icon.svg"><link rel="apple-touch-icon" href="icon-180.png">
<link rel="stylesheet" href="https://api.fontshare.com/v2/css?f[]=general-sans@400,500,600&f[]=zodiak@600&display=swap">
<style>
:root{--bg:#0f1f3d;--bg2:#162a50;--card:#1b3160;--line:#2c4677;--text:#f4efe3;--muted:#b9c3d6;--gold:#e2b13c;--gold2:#f0c75e;--ok:#5cc98a;--no:#ef7b6e;--warn:#f0a93b}
*{box-sizing:border-box}html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--text);font:17px/1.5 "General Sans",system-ui,sans-serif;min-height:100vh}
.wrap{max-width:640px;margin:0 auto;padding:calc(16px + env(safe-area-inset-top)) 16px calc(24px + env(safe-area-inset-bottom))}
header{display:flex;align-items:center;gap:12px;margin:4px 0 20px}
header img{width:48px;height:48px;border-radius:12px}
h1{font:600 21px/1.2 Zodiak,Georgia,serif;margin:0;color:var(--gold2)}
.sub{color:var(--muted);font-size:14px}
h2{font:600 19px/1.3 Zodiak,Georgia,serif;color:var(--gold2);margin:24px 0 12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:12px}
label{display:block;font-size:14px;color:var(--muted);margin:12px 0 4px;font-weight:500}
input,select,textarea{width:100%;font:inherit;color:var(--text);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:11px 12px}
input:focus,select:focus,textarea:focus{outline:2px solid var(--gold);border-color:var(--gold)}
textarea{min-height:80px;resize:vertical}
button,.btn{font:600 16px/1 inherit;font-family:inherit;border:0;border-radius:10px;padding:13px 16px;cursor:pointer;background:var(--gold);color:#1a1405;display:inline-flex;align-items:center;justify-content:center;gap:8px;text-decoration:none;min-height:46px}
button:hover,.btn:hover{background:var(--gold2)}
.ghost{background:transparent;color:var(--gold2);border:1px solid var(--gold)}.ghost:hover{background:rgba(226,177,60,.12)}
.danger{background:transparent;color:var(--no);border:1px solid var(--no)}.danger:hover{background:rgba(239,123,110,.12)}
.full{width:100%}.row{display:flex;gap:8px;flex-wrap:wrap}.row>*{flex:1}
.tabs{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}.tabs button{flex:1;background:var(--bg2);color:var(--muted);border:1px solid var(--line)}.tabs button.on{background:var(--gold);color:#1a1405;border-color:var(--gold)}
.err{color:var(--no);font-size:15px;margin-top:10px;min-height:1em}
.banner{background:rgba(226,177,60,.14);border:1px solid var(--gold);color:var(--gold2);border-radius:12px;padding:12px 14px;margin-bottom:14px;font-weight:500}
details.ev{background:var(--card);border:1px solid var(--line);border-radius:14px;margin-bottom:12px;overflow:hidden}
details.ev.todo{border:2px solid var(--warn);box-shadow:0 0 0 3px rgba(240,169,59,.15)}
summary{list-style:none;cursor:pointer;padding:14px 16px}summary::-webkit-details-marker{display:none}
.st{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.title{font-weight:600;font-size:18px;line-height:1.3}
.date{color:var(--gold2);font-weight:500;font-size:15px;margin-top:2px}
.chev{color:var(--gold);transition:transform .2s;flex:none;margin-top:4px}details[open] .chev{transform:rotate(180deg)}
.tag{display:inline-block;font-size:12px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;border-radius:6px;padding:2px 7px;margin:0 6px 4px 0}
.t-new{background:var(--gold);color:#1a1405}.t-chg{background:#5b8def;color:#fff}.t-todo{background:var(--warn);color:#1a1405}.t-zu{background:rgba(92,201,138,.2);color:var(--ok)}.t-ab{background:rgba(239,123,110,.2);color:var(--no)}
.quick{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.pill{background:var(--bg);border:1px solid var(--line);border-radius:999px;padding:3px 10px;font-size:14px;color:var(--muted)}.pill b{color:var(--text)}
.body{padding:0 16px 16px;border-top:1px solid var(--line)}
.info{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;margin:14px 0}.info dt{color:var(--muted);font-size:15px}.info dd{margin:0}
.note{background:var(--bg);border-left:3px solid var(--gold);padding:10px 12px;border-radius:0 8px 8px 0;margin:10px 0;white-space:pre-wrap}
.ans{display:flex;gap:8px;margin:14px 0}.ans button{flex:1;background:var(--bg);color:var(--text);border:1px solid var(--line)}
.ans .yes.on{background:var(--ok);color:#06210f;border-color:var(--ok)}.ans .no.on{background:var(--no);color:#2a0905;border-color:var(--no)}
.grp{margin-top:12px}.grp h4{margin:0 0 4px;font-size:15px;color:var(--gold2)}
.vg{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.vg div{background:var(--bg);border-radius:10px;padding:8px 10px;font-size:15px}.vg strong{display:block;color:var(--muted);font-size:13px;font-weight:500}
.empty{color:var(--muted);text-align:center;padding:30px 10px}
.wa{background:#25d366;color:#062b14;margin-top:8px}.wa:hover{background:#3ee07b}
footer{text-align:center;color:var(--muted);font-size:14px;margin-top:28px;padding-top:16px;border-top:1px solid var(--line)}
.adminlink{display:block;text-align:center;color:var(--muted);margin-top:18px;font-size:15px;background:none;border:0;width:100%;text-decoration:underline;min-height:auto;padding:8px}
.adminlink:hover{background:none;color:var(--gold2)}
.item{display:flex;justify-content:space-between;align-items:center;gap:10px}.item .m{color:var(--muted);font-size:14px}
.small{font-size:14px;padding:9px 12px;min-height:38px}
.me{display:flex;justify-content:space-between;align-items:center;color:var(--muted);font-size:14px;margin-bottom:14px}
.hide{display:none}
details.sub2{margin-top:12px}details.sub2 summary{padding:6px 0;font-size:15px;font-weight:600;color:var(--gold2)}details.sub2 summary::before{content:"▸ ";display:inline-block}details.sub2[open] summary::before{content:"▾ "}
.acts{display:flex;flex-direction:column;align-items:center;gap:10px;flex:none}.cal{color:var(--gold2);border:1px solid var(--line);border-radius:10px;width:40px;height:40px;display:flex;align-items:center;justify-content:center;background:var(--bg)}.cal:hover{border-color:var(--gold)}
.gst{color:var(--gold2);font-size:13px}
.glist{margin-top:10px;border-top:1px solid var(--line);padding-top:10px}.glist .gi{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:4px 0}
.plain{background:var(--bg);border-radius:10px;padding:8px 10px;font-size:15px}
details.inst{background:var(--card);border:1px solid var(--line);border-radius:14px;margin-top:14px}
details.inst summary{font-weight:600;color:var(--gold2);display:flex;justify-content:space-between;align-items:center}
details.inst .b{padding:0 16px 14px;font-size:15px}details.inst h4{margin:12px 0 4px;color:var(--text)}details.inst ol{margin:0;padding-left:20px}details.inst li{margin:3px 0}
</style></head><body><div class="wrap" id="app"></div>
<script src="config.js"></script>
<script>
const API=(window.PSB_API||"").replace(/\/$/,"");
const WA="https://chat.whatsapp.com/BY3XUYMdCJP6X0cwszDLRo?mode=gi_t";
const V=["Sopran","Alt","Tenor","Bass"];
const mem={};function store(kind){let st=null;try{st=window[kind+"Storage"];st.getItem("x")}catch(e){st=null}
 return{get:k=>{try{return st?st.getItem(k):mem[k]??null}catch(e){return mem[k]??null}},set:(k,v)=>{mem[k]=v;try{st&&st.setItem(k,v)}catch(e){}},del:k=>{delete mem[k];try{st&&st.removeItem(k)}catch(e){}}}}
const LS=store("local"),SS=store("session");
const $=s=>document.querySelector(s);const app=$("#app");
let token=LS.get("psb_token"),adminPin=SS.get("psb_admin"),me=null,view="main",atab="events",editEv=null,editUser=null;
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
async function api(p,o={}){const r=await fetch(API+p,{method:o.method||"GET",headers:{"Content-Type":"application/json","X-Token":token||"","X-Admin":adminPin||""},body:o.body?JSON.stringify(o.body):undefined});
 const d=await r.json().catch(()=>({}));if(r.status===401&&!p.startsWith("/api/login")&&!p.startsWith("/api/register")){logoutLocal();throw new Error(d.detail||"Bitte anmelden")}
 if(!r.ok)throw new Error(typeof d.detail==="string"?d.detail:"Fehler");return d}
function logoutLocal(){token=null;LS.del("psb_token");me=null;view="main";render()}
const head=()=>`<header><img src="icon-180.png" alt=""><div><h1>Posaunenchor Striesen Blasewitz</h1><div class="sub">Termine &amp; Zusagen</div></div></header>`;
const install=()=>`<details class="inst"><summary>App auf dem Handy als Icon ablegen<svg class="chev" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="m6 9 6 6 6-6"/></svg></summary><div class="b">
<h4>iPhone / iPad</h4><ol><li>Diese Seite in <b>Safari</b> öffnen.</li><li>Unten auf das <b>Teilen-Symbol</b> tippen (Quadrat mit Pfeil nach oben).</li><li><b>„Zum Home-Bildschirm“</b> wählen (ggf. nach unten scrollen).</li><li>Auf <b>„Hinzufügen“</b> tippen – fertig, das Posaunen-Icon ist da.</li></ol>
<h4>Android</h4><ol><li>Diese Seite in <b>Chrome</b> öffnen.</li><li>Oben rechts auf die <b>drei Punkte</b> tippen.</li><li><b>„Zum Startbildschirm hinzufügen“</b> bzw. <b>„App installieren“</b> wählen.</li><li>Mit <b>„Hinzufügen“</b> bestätigen.</li></ol>
<p class="sub" style="margin:10px 0 0">Nach dem Öffnen über das Icon bleibst du angemeldet.</p></div></details>`;
const foot=()=>`<footer>© Ruben Gläser +491739558148</footer>`;
const fmtDate=d=>new Date(d+"T12:00:00").toLocaleDateString("de-DE",{weekday:"long",day:"numeric",month:"long",year:"numeric"});
const voiceOpts=sel=>`<option value="">Bitte wählen …</option>`+V.map(v=>`<option ${v===sel?"selected":""}>${v}</option>`).join("");

function render(){if(view==="admin")return renderAdmin();if(!token)return renderAuth();renderMain()}

let authTab="login";
function renderAuth(){app.innerHTML=head()+`<div class="card"><div class="tabs"><button id="tl" class="${authTab==="login"?"on":""}">Anmelden</button><button id="tr" class="${authTab==="reg"?"on":""}">Registrieren</button></div>
<form id="af">${authTab==="reg"?`<label for="un">Nutzername (mind. 4 Zeichen)</label><input id="un" autocomplete="username" autocapitalize="none" minlength="4" required>
<label for="nm">Angezeigter Name</label><input id="nm" required><label for="vc">Stimmgruppe</label><select id="vc" required>${voiceOpts()}</select>`:
`<label for="un">Nutzername</label><input id="un" autocomplete="username" autocapitalize="none" required>`}
<label for="pn">PIN (4 Ziffern)</label><input id="pn" type="password" inputmode="numeric" pattern="\\d{4}" maxlength="4" autocomplete="current-password" required>
<div class="err" id="er"></div><button class="full" style="margin-top:8px">${authTab==="reg"?"Registrieren":"Anmelden"}</button></form>
${authTab==="login"?`<p class="sub" style="margin:12px 0 0">PIN vergessen? Die Chorleitung kann sie zurücksetzen.</p>`:""}</div>
<button class="adminlink" id="al">Admin-Bereich</button>`+install()+foot();
 $("#tl").onclick=()=>{authTab="login";renderAuth()};$("#tr").onclick=()=>{authTab="reg";renderAuth()};$("#al").onclick=openAdmin;
 $("#af").onsubmit=async e=>{e.preventDefault();$("#er").textContent="";
  const body={username:$("#un").value,pin:$("#pn").value};if(authTab==="reg"){body.name=$("#nm").value;body.voice=$("#vc").value}
  try{const d=await api(authTab==="reg"?"/api/register":"/api/login",{method:"POST",body});token=d.token;LS.set("psb_token",token);render()}catch(x){$("#er").textContent=x.message}}}

const nm=r=>esc(r.name)+(r.guest?' <span class="gst">(Gast)</span>':"");
function names(list){return list.length?`<div class="plain">${list.map(nm).join(", ")}</div>`:`<div class="plain">–</div>`}
function groups(list,cls){return `<div class="vg">`+V.map(v=>{const n=list.filter(r=>r.voice===v);return `<div><strong>${v} (${n.length})</strong>${n.length?n.map(nm).join("<br>"):"–"}</div>`}).join("")+`</div>`}
let openIds=new Set();
async function renderMain(){
 try{if(!me)me=await api("/api/me");var evs=await api("/api/events")}catch(x){if(token)app.innerHTML=head()+`<div class="card err">${esc(x.message)}</div>`;return}
 const nNew=evs.filter(e=>e.badge==="neu").length,nChg=evs.filter(e=>e.badge==="geändert").length,nTodo=evs.filter(e=>!e.mine).length;
 let msg=[];if(nNew)msg.push(nNew===1?"1 neuer Termin":nNew+" neue Termine");if(nChg)msg.push(nChg===1?"1 geänderter Termin":nChg+" geänderte Termine");
 app.innerHTML=head()+`<div class="me"><span>Angemeldet als <b style="color:var(--text)">${esc(me.name)}</b> · ${esc(me.voice)}</span><button class="ghost small" id="lo">Abmelden</button></div>`+
 (msg.length?`<div class="banner">Neu: ${msg.join(" und ")}</div>`:"")+
 (nTodo?`<div class="banner" style="border-color:var(--warn);color:var(--warn);background:rgba(240,169,59,.1)">Bitte antworten: ${nTodo} ${nTodo===1?"Termin":"Termine"} ohne Zu- oder Absage</div>`:"")+
 `<h2>Termine</h2>`+(evs.length?evs.map(e=>{const zu=e.responses.filter(r=>r.status==="zu"),ab=e.responses.filter(r=>r.status==="ab");
  return `<details class="ev ${e.mine?"":"todo"}" data-id="${e.id}" ${openIds.has(e.id)?"open":""}><summary><div class="st"><div>
  <div>${e.badge==="neu"?'<span class="tag t-new">Neu</span>':""}${e.badge==="geändert"?'<span class="tag t-chg">Geändert</span>':""}${!e.mine?'<span class="tag t-todo">Bitte antworten</span>':e.mine==="zu"?'<span class="tag t-zu">Du hast zugesagt</span>':'<span class="tag t-ab">Du hast abgesagt</span>'}</div>
  <div class="title">${esc(e.title)}</div><div class="date">${fmtDate(e.date)}${e.time?" · "+esc(e.time)+" Uhr":""}</div>
  <div class="quick">${V.map(v=>`<span class="pill">${v} <b>${zu.filter(r=>r.voice===v).length}</b></span>`).join("")}</div></div>
  <div class="acts"><a class="cal" href="${API}/api/ics/${e.id}?t=${encodeURIComponent(token)}" title="In meinen Kalender übernehmen" aria-label="In meinen Kalender übernehmen" onclick="event.stopPropagation()"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18M12 14v5M9.5 16.5 12 19l2.5-2.5"/></svg></a><svg class="chev" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="m6 9 6 6 6-6"/></svg></div></div></summary>
  <div class="body"><dl class="info"><dt>Ort</dt><dd>${esc(e.place)||"–"}</dd><dt>Beginn</dt><dd>${e.time?esc(e.time)+" Uhr":"–"}</dd><dt>Anspielzeit</dt><dd>${e.warmup?esc(e.warmup)+" Uhr":"–"}</dd></dl>
  ${e.notes?`<div class="sub">Besondere Hinweise</div><div class="note">${esc(e.notes)}</div>`:""}
  <div class="ans"><button class="yes ${e.mine==="zu"?"on":""}" data-a="zu">Zusagen</button><button class="no ${e.mine==="ab"?"on":""}" data-a="ab">Absagen</button></div>
  <div class="grp"><h4>Zusagen (${zu.length})</h4>${groups(zu)}</div><details class="sub2"><summary>Absagen (${ab.length})</summary>${names(ab)}</details>
  <details class="sub2"><summary>Noch keine Antwort (${e.pending.length})</summary>${names(e.pending)}</details></div></details>`}).join(""):`<div class="card empty">Aktuell sind keine Termine eingetragen.</div>`)+
 `<a class="btn wa full" href="${WA}" target="_blank" rel="noopener"><svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2a10 10 0 0 0-8.6 15.1L2 22l5-1.3A10 10 0 1 0 12 2Zm0 18.2a8.2 8.2 0 0 1-4.2-1.2l-.3-.2-3 .8.8-2.9-.2-.3A8.2 8.2 0 1 1 12 20.2Zm4.5-6.1c-.2-.1-1.5-.7-1.7-.8-.2-.1-.4-.1-.6.1l-.8 1c-.1.2-.3.2-.5.1a6.7 6.7 0 0 1-3.3-2.9c-.2-.4.2-.4.7-1.3.1-.2 0-.3 0-.4l-.8-1.8c-.2-.5-.4-.4-.6-.4h-.5a1 1 0 0 0-.7.3 3 3 0 0 0-.9 2.2 5.2 5.2 0 0 0 1.1 2.7 11.8 11.8 0 0 0 4.5 4c1.7.7 2.3.8 3.2.6.5-.1 1.5-.6 1.7-1.2.2-.6.2-1.1.2-1.2l-.5-.3Z"/></svg>Zur WhatsApp-Gruppe</a>
 <button class="adminlink" id="al">Admin-Bereich</button>`+install()+foot();
 $("#lo").onclick=async()=>{try{await api("/api/logout",{method:"POST"})}catch(e){}logoutLocal()};$("#al").onclick=openAdmin;
 document.querySelectorAll("details.ev").forEach(d=>{const id=+d.dataset.id;d.addEventListener("toggle",()=>{if(d.open){openIds.add(id);const e=evs.find(x=>x.id===id);if(e.badge)api(`/api/events/${id}/seen`,{method:"POST"}).catch(()=>{})}else openIds.delete(id)});
  d.querySelectorAll(".ans button").forEach(b=>b.onclick=async()=>{b.disabled=true;try{await api(`/api/events/${id}/respond`,{method:"POST",body:{status:b.dataset.a}});renderMain()}catch(x){alert(x.message);b.disabled=false}})})}

async function openAdmin(){if(adminPin){try{await api("/api/admin/check",{method:"POST"});view="admin";return render()}catch(e){adminPin=null;SS.del("psb_admin")}}
 app.innerHTML=head()+`<div class="card"><h2 style="margin-top:0">Admin-Bereich</h2><form id="apf"><label for="ap">Admin-PIN</label><input id="ap" type="password" inputmode="numeric" maxlength="4" required autofocus><div class="err" id="er"></div>
 <div class="row" style="margin-top:8px"><button type="button" class="ghost" id="bk">Zurück</button><button>Öffnen</button></div></form></div>`+foot();
 $("#bk").onclick=()=>{view="main";render()};
 $("#apf").onsubmit=async e=>{e.preventDefault();adminPin=$("#ap").value;try{await api("/api/admin/check",{method:"POST"});SS.set("psb_admin",adminPin);view="admin";render()}catch(x){adminPin=null;$("#er").textContent=x.message}}}

function evForm(e={}){return `<form id="ef" class="card"><h2 style="margin-top:0">${e.id?"Termin bearbeiten":"Neuer Termin"}</h2>
<label for="ft">Titel *</label><input id="ft" required value="${esc(e.title)}" placeholder="z. B. Gottesdienst Versöhnungskirche">
<div class="row"><div><label for="fd">Datum *</label><input id="fd" type="date" required value="${esc(e.date)}"></div><div><label for="fz">Beginn</label><input id="fz" type="time" value="${esc(e.time)}"></div><div><label for="fw">Anspielzeit</label><input id="fw" type="time" value="${esc(e.warmup)}"></div></div>
<label for="fo">Ort</label><input id="fo" value="${esc(e.place)}"><label for="fn">Besondere Hinweise</label><textarea id="fn">${esc(e.notes)}</textarea>
<div class="err" id="er"></div><div class="row" style="margin-top:8px"><button type="button" class="ghost" id="fc">Abbrechen</button><button>Speichern</button></div></form>`}

async function renderAdmin(){let body="";
 try{if(atab==="events"){if(editEv!==null)body=evForm(editEv);else{const evs=await api("/api/admin/events");
   body=`<button class="full" id="ne" style="margin-bottom:14px">+ Neuer Termin</button>`+(evs.length?evs.map(e=>{const zu=e.responses.filter(r=>r.status==="zu").length,ab=e.responses.filter(r=>r.status==="ab").length;
   return `<div class="card" style="${e.past?"opacity:.6":""}"><div class="title">${esc(e.title)}</div><div class="date">${fmtDate(e.date)}${e.time?" · "+esc(e.time)+" Uhr":""}${e.past?" · vergangen":""}</div>
   <div class="sub">${esc(e.place)} · ${zu} Zusagen · ${ab} Absagen · ${e.pending.length} offen</div>
   ${(()=>{const g=e.responses.filter(r=>r.guest);return `<div class="glist"><div class="sub" style="font-weight:600;color:var(--gold2)">Gäste (${g.length})</div>${g.map(r=>`<div class="gi"><span>${esc(r.name)} · ${esc(r.voice)} · ${r.status==="zu"?"Zusage":"Absage"}</span><button class="danger small" data-gdel="${e.id}:${r.gid}">Entfernen</button></div>`).join("")}
   ${e.past?"":`<details class="sub2"><summary>+ Gast eintragen</summary><form class="gform" data-ev="${e.id}"><label>Name</label><input name="gn" required placeholder="z. B. Max Mustermann">
   <div class="row"><div><label>Stimmgruppe</label><select name="gv" required>${voiceOpts()}</select></div><div><label>Antwort</label><select name="gs"><option value="zu">Zusage</option><option value="ab">Absage</option></select></div></div>
   <div class="err"></div><button class="full small" style="margin-top:6px">Gast hinzufügen</button></form></details>`}</div>`})()}
   <div class="row" style="margin-top:10px"><button class="ghost small" data-ed="${e.id}">Bearbeiten</button><button class="ghost small" data-du="${e.id}">Duplizieren</button><button class="danger small" data-de="${e.id}">Löschen</button></div></div>`}).join(""):`<div class="card empty">Noch keine Termine.</div>`);
   window._evs=evs}}
  else if(atab==="users"){const us=await api("/api/admin/users");window._us=us;
   body=(editUser?`<form id="uf" class="card"><h2 style="margin-top:0">Mitglied bearbeiten</h2><label for="uu">Nutzername</label><input id="uu" value="${esc(editUser.username)}" required minlength="4">
   <label for="un2">Klarname</label><input id="un2" value="${esc(editUser.name)}" required><label for="uv">Stimmgruppe</label><select id="uv">${voiceOpts(editUser.voice)}</select>
   <label for="up">Neue PIN (leer lassen = unverändert)</label><input id="up" inputmode="numeric" maxlength="4" placeholder="4 Ziffern"><div class="err" id="er"></div>
   <div class="row" style="margin-top:8px"><button type="button" class="ghost" id="uc">Abbrechen</button><button>Speichern</button></div></form>`:"")+
   `<div class="sub" style="margin-bottom:10px">${us.length} Mitglieder · PINs sind verschlüsselt gespeichert und können hier neu gesetzt werden.</div>`+
   (us.length?us.map(u=>`<div class="card item"><div><div style="font-weight:600">${esc(u.name)}</div><div class="m">@${esc(u.username)} · ${esc(u.voice)}</div></div>
   <div class="row" style="flex:none"><button class="ghost small" data-eu="${u.id}">Bearbeiten</button><button class="danger small" data-du2="${u.id}">Löschen</button></div></div>`).join(""):`<div class="card empty">Noch keine Mitglieder registriert.</div>`)}
  else if(atab==="backup")body=`<div class="card"><h2 style="margin-top:0">Daten sichern</h2><p class="sub" style="margin-top:0">Lädt alle Mitglieder, Termine und Zu-/Absagen als Datei herunter. Am besten regelmäßig (z.&nbsp;B. monatlich) und vor größeren Änderungen sichern und die Datei gut aufbewahren.</p>
   <button class="full" id="bk1">Sicherung herunterladen</button></div>
   <div class="card"><h2 style="margin-top:0">Daten wiederherstellen</h2><p class="sub" style="margin-top:0">Ersetzt ALLE aktuellen Daten durch den Stand der Sicherungsdatei. Auch die Admin-PIN wird auf den damaligen Stand gesetzt. Alle Mitglieder müssen sich danach neu anmelden.</p>
   <label for="rf">Sicherungsdatei (.json)</label><input id="rf" type="file" accept=".json,application/json"><div class="err" id="er"></div><button class="danger full" id="bk2" style="margin-top:8px">Wiederherstellen</button></div>`;
  else body=`<form id="pf" class="card"><h2 style="margin-top:0">Admin-PIN ändern</h2><label for="p1">Neue Admin-PIN</label><input id="p1" type="password" inputmode="numeric" maxlength="4" required>
   <label for="p2">Wiederholen</label><input id="p2" type="password" inputmode="numeric" maxlength="4" required><div class="err" id="er"></div><button class="full" style="margin-top:8px">PIN speichern</button></form>`}
 catch(x){body=`<div class="card err">${esc(x.message)}</div>`}
 app.innerHTML=head()+`<div class="me"><span style="color:var(--gold2);font-weight:600">Admin-Bereich</span><button class="ghost small" id="ax">Schließen</button></div>
 <div class="tabs"><button data-t="events" class="${atab==="events"?"on":""}">Termine</button><button data-t="users" class="${atab==="users"?"on":""}">Mitglieder</button><button data-t="pin" class="${atab==="pin"?"on":""}">Admin-PIN</button><button data-t="backup" class="${atab==="backup"?"on":""}">Sicherung</button></div>`+body+foot();
 $("#ax").onclick=()=>{view="main";adminPin=null;SS.del("psb_admin");editEv=null;editUser=null;render()};
 document.querySelectorAll("[data-t]").forEach(b=>b.onclick=()=>{atab=b.dataset.t;editEv=null;editUser=null;renderAdmin()});
 const on=(s,f)=>document.querySelectorAll(s).forEach(b=>b.onclick=()=>f(b));
 if($("#ne"))$("#ne").onclick=()=>{editEv={};renderAdmin()};
 on("[data-ed]",b=>{editEv=_evs.find(e=>e.id==b.dataset.ed);renderAdmin()});
 on("[data-du]",b=>{const e=_evs.find(e=>e.id==b.dataset.du);editEv={...e,id:null,date:""};renderAdmin()});
 document.querySelectorAll(".gform").forEach(f=>f.onsubmit=async ev=>{ev.preventDefault();try{await api(`/api/admin/events/${f.dataset.ev}/guests`,{method:"POST",body:{name:f.gn.value,voice:f.gv.value,status:f.gs.value}});renderAdmin()}catch(x){f.querySelector(".err").textContent=x.message}});
 on("[data-gdel]",async b=>{const [ev,g]=b.dataset.gdel.split(":");if(confirm("Gast entfernen?")){await api(`/api/admin/events/${ev}/guests/${g}`,{method:"DELETE"});renderAdmin()}});
 on("[data-de]",async b=>{if(confirm("Termin wirklich löschen? Alle Zu- und Absagen gehen verloren.")){await api("/api/admin/events/"+b.dataset.de,{method:"DELETE"});renderAdmin()}});
 if($("#ef")){$("#fc").onclick=()=>{editEv=null;renderAdmin()};$("#ef").onsubmit=async ev=>{ev.preventDefault();const b={title:$("#ft").value,date:$("#fd").value,time:$("#fz").value,warmup:$("#fw").value,place:$("#fo").value,notes:$("#fn").value};
  try{await api("/api/admin/events"+(editEv.id?"/"+editEv.id:""),{method:editEv.id?"PUT":"POST",body:b});editEv=null;renderAdmin()}catch(x){$("#er").textContent=x.message}}}
 on("[data-eu]",b=>{editUser=_us.find(u=>u.id==b.dataset.eu);renderAdmin();scrollTo(0,0)});
 on("[data-du2]",async b=>{const u=_us.find(u=>u.id==b.dataset.du2);if(confirm(`${u.name} wirklich löschen? Die bisherigen Zu- und Absagen bleiben erhalten.`)){await api("/api/admin/users/"+u.id,{method:"DELETE"});if(me&&me.id===u.id)logoutLocal();else renderAdmin()}});
 if($("#uf")){$("#uc").onclick=()=>{editUser=null;renderAdmin()};$("#uf").onsubmit=async ev=>{ev.preventDefault();
  try{await api("/api/admin/users/"+editUser.id,{method:"PUT",body:{username:$("#uu").value,name:$("#un2").value,voice:$("#uv").value,pin:$("#up").value}});editUser=null;me=null;renderAdmin()}catch(x){$("#er").textContent=x.message}}}
 if($("#bk1"))$("#bk1").onclick=async()=>{try{const r=await fetch(API+"/api/admin/backup",{headers:{"X-Admin":adminPin||""}});if(!r.ok)throw new Error((await r.json().catch(()=>({}))).detail||"Fehler");
   const b=await r.blob(),a=document.createElement("a");a.href=URL.createObjectURL(b);a.download="posaunenchor-sicherung-"+new Date().toISOString().slice(0,10)+".json";document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),5000)}catch(x){alert(x.message)}};
 if($("#bk2"))$("#bk2").onclick=async()=>{const f=$("#rf").files[0];if(!f)return $("#er").textContent="Bitte zuerst eine Sicherungsdatei auswählen";
   if(!confirm("Wirklich ALLE aktuellen Daten durch die Sicherung ersetzen?"))return;
   try{const j=JSON.parse(await f.text());const r=await api("/api/admin/restore",{method:"POST",body:j});alert(`Wiederhergestellt: ${r.users} Mitglieder, ${r.events} Termine. Bitte mit der Admin-PIN aus der Sicherung erneut öffnen.`);
   adminPin=null;SS.del("psb_admin");token=null;LS.del("psb_token");me=null;view="main";render()}catch(x){$("#er").textContent=x instanceof SyntaxError?"Die Datei ist keine gültige Sicherung":x.message}};
 if($("#pf"))$("#pf").onsubmit=async ev=>{ev.preventDefault();if($("#p1").value!==$("#p2").value)return $("#er").textContent="Die PINs stimmen nicht überein";
  try{await api("/api/admin/pin",{method:"PUT",body:{pin:$("#p1").value}});adminPin=$("#p1").value;SS.set("psb_admin",adminPin);$("#er").style.color="var(--ok)";$("#er").textContent="Admin-PIN wurde geändert."}catch(x){$("#er").textContent=x.message}}}
render();
</script></body></html>
