<!doctype html>
<html lang="de"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Würfelzeit</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100svh;display:grid;place-items:center;background:#111827;color:#f8fafc;font-family:system-ui,sans-serif;padding:24px}main{width:min(100%,520px);text-align:center;background:#1e293b;padding:32px 24px;border-radius:28px}h1{margin:0 0 8px}.hint,#history,.note{color:#cbd5e1}select{font:inherit;background:#334155;color:white;border:1px solid #64748b;border-radius:10px;padding:8px}.dice{display:flex;flex-wrap:wrap;justify-content:center;gap:16px;margin:28px 0;min-height:110px}button{font:700 20px system-ui;cursor:pointer;border:0;border-radius:14px}#roll{width:100%;padding:16px;background:#a3e635;color:#172005}.die{width:100px;height:100px;background:white;display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(3,1fr);padding:16px;gap:7px;border-radius:20px;box-shadow:0 6px 0 #cbd5e1}.pip{border-radius:50%}.pip.on{background:#111827}button:disabled{cursor:wait;opacity:.65}button:focus-visible,select:focus-visible{outline:3px solid #38bdf8;outline-offset:4px}#result{font-size:22px}#history,.note{font-size:14px;line-height:1.6}table{width:100%;border-collapse:collapse;margin-top:12px}th,td{padding:9px;border-bottom:1px solid #475569}caption{font-size:20px;font-weight:700;margin-top:24px}.rolling .die{animation:wobble .12s infinite alternate}@keyframes wobble{from{transform:rotate(-8deg)}to{transform:rotate(8deg)}}@media(prefers-reduced-motion:reduce){.rolling .die{animation:none}}
</style>
<main><h1>Würfelzeit 🎲</h1><p class="hint">Klicke auf einen Würfel oder den Button.</p><label for="count">Anzahl der Würfel</label> <select id="count"><option>1</option><option>2</option><option>3</option><option>4</option><option>5</option><option>6</option></select><div id="dice" class="dice"></div><button id="roll" type="button">Jetzt würfeln</button><p id="result" aria-live="polite">Bereit für deinen ersten Wurf?</p><div id="history"></div><table><caption>Häufigkeit der Augenzahlen</caption><thead><tr><th scope="col">Augenzahl</th><th scope="col">Anzahl</th></tr></thead><tbody id="stats"></tbody></table><p id="total">0 Würfelwürfe insgesamt</p><p class="note">Jeder Würfel zählt einzeln. Nur endgültige Ergebnisse werden gezählt. Beim Neuladen beginnt die Statistik bei null.</p></main>
<script>
const faces={1:[4],2:[0,8],3:[0,4,8],4:[0,2,6,8],5:[0,2,4,6,8],6:[0,2,3,5,6,8]};
const dice=document.getElementById('dice'),count=document.getElementById('count'),button=document.getElementById('roll'),result=document.getElementById('result'),historyEl=document.getElementById('history'),stats=document.getElementById('stats'),total=document.getElementById('total');let past=[],busy=false;const frequency=Array(6).fill(0);
function randomDie(){let x;const a=new Uint32Array(1);do{crypto.getRandomValues(a);x=a[0]}while(x>=4294967292);return x%6+1}
function render(values){while(dice.children.length>values.length)dice.lastChild.remove();values.forEach((n,i)=>{let el=dice.children[i];if(!el){el=document.createElement('button');el.type='button';el.className='die';for(let j=0;j<9;j++){const dot=document.createElement('span');dot.className='pip';dot.setAttribute('aria-hidden','true');el.append(dot)}dice.append(el)}el.disabled=busy;el.setAttribute('aria-label','Würfel '+(i+1)+': '+n+' Augen. Alle Würfel erneut werfen.');Array.from(el.children).forEach((dot,j)=>dot.classList.toggle('on',faces[n].includes(j)))})}
function updateStats(){stats.replaceChildren();frequency.forEach((value,i)=>{const row=document.createElement('tr'),label=document.createElement('th'),cell=document.createElement('td');label.scope='row';label.textContent=i+1;cell.textContent=value;row.append(label,cell);stats.append(row)});total.textContent=frequency.reduce((a,b)=>a+b,0)+' Würfelwürfe insgesamt'}
function roll(){if(busy)return;busy=true;button.disabled=true;count.disabled=true;dice.classList.add('rolling');const n=Number(count.value);render(Array.from({length:n},randomDie));const timer=setInterval(()=>render(Array.from({length:n},randomDie)),75);setTimeout(()=>{clearInterval(timer);const values=Array.from({length:n},randomDie);values.forEach(v=>frequency[v-1]++);busy=false;render(values);dice.classList.remove('rolling');const sum=values.reduce((a,b)=>a+b,0);result.textContent=n===1?'Gewürfelt: '+sum:'Summe: '+sum+' · '+values.join(' + ');past.unshift(values.join(' + ')+' = '+sum);past=past.slice(0,5);historyEl.textContent='Letzte Würfe: '+past.join(' | ');updateStats();button.disabled=false;count.disabled=false},500)}
button.addEventListener('click',roll);dice.addEventListener('click',e=>{if(e.target.closest('.die'))roll()});count.addEventListener('change',()=>{render(Array(Number(count.value)).fill(1));result.textContent='Bereit für deinen nächsten Wurf?'});document.addEventListener('keydown',e=>{if(e.code==='Space'&&e.target===document.body){e.preventDefault();roll()}});render([1]);updateStats();
</script></html>
