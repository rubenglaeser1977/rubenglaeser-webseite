<!doctype html>
<html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Würfelzeit</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100svh;display:grid;place-items:center;background:#111827;color:#f8fafc;font-family:system-ui,sans-serif;padding:24px}main{width:min(100%,520px);text-align:center;background:#1e293b;padding:32px 24px;border-radius:28px;box-shadow:0 24px 80px #0005}h1{margin:0 0 8px;font-size:32px}.hint{color:#cbd5e1;margin:0 0 24px}label{display:block;margin-bottom:12px}select{font:inherit;background:#334155;color:white;border:1px solid #64748b;border-radius:10px;padding:8px 12px;margin-left:8px}.dice{display:flex;flex-wrap:wrap;justify-content:center;gap:16px;margin:28px 0;min-height:110px}.die{width:100px;height:100px;border-radius:20px;background:#fff;color:#111827;display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(3,1fr);padding:16px;gap:7px;box-shadow:0 6px 0 #cbd5e1}.pip{border-radius:50%;background:transparent}.pip.on{background:#111827}button{width:100%;padding:16px;font:700 20px system-ui;border:0;border-radius:14px;background:#a3e635;color:#172005;cursor:pointer}button:hover{background:#bef264}button:disabled{opacity:.65;cursor:wait}button:focus-visible,select:focus-visible{outline:3px solid #38bdf8;outline-offset:4px}#result{font-size:22px;min-height:32px;margin:24px 0 10px}#history{color:#cbd5e1;font-size:14px;line-height:1.6}.rolling .die{animation:wobble .12s infinite alternate}@keyframes wobble{from{transform:rotate(-8deg) translateY(-4px)}to{transform:rotate(8deg) translateY(4px)}}@media(prefers-reduced-motion:reduce){.rolling .die{animation:none}}
</style></head><body><main><h1>Würfelzeit 🎲</h1><p class="hint">Ein Klick. Ein Wurf. Dein Glück.</p><label for="count">Anzahl der Würfel <select id="count"><option value="1">1</option><option value="2">2</option><option value="3">3</option><option value="4">4</option><option value="5">5</option><option value="6">6</option></select></label><div id="dice" class="dice" aria-label="Würfel"></div><button id="roll" type="button">Jetzt würfeln</button><p id="result" aria-live="polite">Bereit für deinen ersten Wurf?</p><div id="history"></div></main>
<script>
const faces={1:[4],2:[0,8],3:[0,4,8],4:[0,2,6,8],5:[0,2,4,6,8],6:[0,2,3,5,6,8]};
const dice=document.getElementById('dice'),count=document.getElementById('count'),button=document.getElementById('roll'),result=document.getElementById('result'),history=document.getElementById('history');let past=[],busy=false;
function randomDie(){let x;const a=new Uint32Array(1);do{crypto.getRandomValues(a);x=a[0]}while(x>=4294967292);return x%6+1}
function render(values){dice.replaceChildren();for(const n of values){const el=document.createElement('div');el.className='die';el.setAttribute('role','img');el.setAttribute('aria-label',n+' Augen');for(let i=0;i<9;i++){const dot=document.createElement('span');dot.className='pip'+(faces[n].includes(i)?' on':'');el.append(dot)}dice.append(el)}}
function roll(){if(busy)return;busy=true;button.disabled=true;count.disabled=true;dice.classList.add('rolling');const n=Number(count.value);const timer=setInterval(()=>render(Array.from({length:n},randomDie)),75);setTimeout(()=>{clearInterval(timer);const values=Array.from({length:n},randomDie);render(values);dice.classList.remove('rolling');const sum=values.reduce((a,b)=>a+b,0);result.textContent=n===1?'Gewürfelt: '+sum:'Summe: '+sum+' · '+values.join(' + ');past.unshift(values.join(' + ')+' = '+sum);past=past.slice(0,5);history.textContent='Letzte Würfe: '+past.join(' | ');busy=false;button.disabled=false;count.disabled=false},500)}
button.addEventListener('click',roll);count.addEventListener('change',()=>{render(Array(Number(count.value)).fill(1));result.textContent='Bereit für deinen nächsten Wurf?'});document.addEventListener('keydown',e=>{if(e.code==='Space'&&e.target===document.body){e.preventDefault();roll()}});render([1]);
</script></body></html>
